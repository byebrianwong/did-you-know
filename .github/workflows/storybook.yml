# Runs on every push.
# - test: runs every story as a test in Chromium (render, play function, accessibility).
# - chromatic: publishes Storybook to Chromatic, which snapshots every story in
#   light and dark (and phone width for pages) and shows visual changes for review.
#   Needs the CHROMATIC_PROJECT_TOKEN repository secret.
name: Storybook

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Chromatic needs the git history to find the baseline build.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Chromatic recommends @latest, so the CLI stays in step with its service.
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # TurboSnap: only snapshot stories whose files changed.
          onlyChanged: true
